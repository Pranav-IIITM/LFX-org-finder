<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Projects - LFX Mentorship Finder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">
    <link rel="stylesheet" href="src/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🐧</span>
                <strong>LFX Mentorship</strong> <em>Finder</em>
            </div>
            <div class="nav-links">
                <a href="index.html">← Back to Organizations</a>
            </div>
        </div>
    </nav>

    <header class="org-hero">
        <div class="container">
            <div style="margin-bottom: 16px;">
                <span id="term-badge" class="badge">LFX Term</span>
            </div>
            <h1 id="org-title">Loading...</h1>
            <p id="org-subtitle">Project Ideas list</p>
        </div>
    </header>

    <section class="page-section" style="padding-top: 0;">
        <div class="container projects-container">
            <div id="projects-list">
                <!-- Projects injected here -->
            </div>
        </div>
    </section>

    <script src="src/js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orgName = urlParams.get('org');
            const term = urlParams.get('term');
            
            document.getElementById('org-title').textContent = orgName || 'Unknown Organization';
            document.getElementById('term-badge').textContent = term ? term.replace('-', ' ') : 'All Terms';

            const projectsList = document.getElementById('projects-list');

            if (!orgName) {
                projectsList.innerHTML = '<div class="empty-state"><p>No organization specified in URL.</p></div>';
                return;
            }

            const orgProjects = LFX_PROJECTS.filter(p => p.org === orgName && (!term || p.term === term));

            if (orgProjects.length === 0) {
                projectsList.innerHTML = '<div class="empty-state"><p>No projects found for this organization in the selected term.</p></div>';
                return;
            }

            orgProjects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                card.innerHTML = `
                    <h3>${project.title}</h3>
                    <div class="project-mentors">
                        <span class="project-mentors-label">Mentors:</span>
                        ${project.mentors.map(m => `<a href="https://github.com/${m.github}" target="_blank" class="project-mentor-link">@${m.github}</a>`).join(', ')}
                    </div>
                    <div class="tags" style="margin-bottom: 20px; padding: 0;">
                        ${project.skills.map(skill => `<span class="tag">${skill}</span>`).join('')}
                    </div>
                    <p>${project.description}</p>
                    <div class="project-actions">
                        <a href="${project.issueUrl}" target="_blank" class="btn-lfx">View Upstream Issue</a>
                        <a href="${project.lfxUrl}" target="_blank" class="btn-lfx btn-outline">View on LFX Portal</a>
                    </div>
                `;
                projectsList.appendChild(card);
            });
        });
    </script>
</body>
</html>
