<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Mentees - LFX Mentorship Finder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">
    <link rel="stylesheet" href="src/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🐧</span>
                <strong>LFX Mentorship</strong> <em>Finder</em>
            </div>
            <div class="nav-links">
                <a href="index.html#mentees">← Back to Organizations</a>
            </div>
        </div>
    </nav>

    <header class="org-hero">
        <div class="container">
            <h1 id="org-title">Organization Mentees</h1>
            <p id="org-subtitle">Past Mentees Directory</p>
        </div>
    </header>

    <section class="page-section" style="padding-top: 0;">
        <div class="container">
            <div id="mentees-grid" class="mentees-grid" style="margin-top: -20px;">
                <!-- Mentees injected here -->
            </div>
        </div>
    </section>

    <script src="src/js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orgName = urlParams.get('org');
            
            if (orgName) {
                document.getElementById('org-title').textContent = orgName;
            }

            const menteesGrid = document.getElementById('mentees-grid');

            let orgMentees = typeof LFX_MENTEES !== 'undefined' ? LFX_MENTEES : [];
            if (orgName) {
                orgMentees = orgMentees.filter(m => m.org === orgName);
            }

            if (orgMentees.length === 0) {
                menteesGrid.innerHTML = '<div class="empty-state"><p>No past mentees found.</p></div>';
                return;
            }

            menteesGrid.innerHTML = orgMentees.map(mentee => `
                <div class="mentee-card">
                    <h4>${mentee.name}</h4>
                    <p class="mentee-project"><strong>Project:</strong> ${mentee.project}</p>
                    <p class="mentee-term"><strong>Term:</strong> ${mentee.term}</p>
                    <div class="mentee-socials">
                        ${mentee.github ? `<a href="${mentee.github}" target="_blank" class="social-link github">GitHub</a>` : ''}
                        ${mentee.linkedin ? `<a href="${mentee.linkedin}" target="_blank" class="social-link linkedin">LinkedIn</a>` : ''}
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
