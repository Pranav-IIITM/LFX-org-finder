<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFX Mentorship Finder</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🚀 LFX Org Finder</h1>
            <p>Find your perfect Linux Foundation Mentorship project — filtered by term, category, and tech stack.</p>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <input type="text" id="search-input" placeholder="Search projects, orgs, or skills...">
            <select id="term-filter">
                <option value="all">All Terms</option>
                <option value="2026-Term-1" selected>2026 Term 1</option>
                <option value="2025-Term-3">2025 Term 3</option>
            </select>
        </div>

        <div id="stats-container" class="stats">
            <!-- Dynamic stats like "Showing X projects" -->
        </div>

        <div id="projects-grid" class="grid">
            <!-- Project cards will be injected here by JS -->
        </div>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="src/js/data.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
