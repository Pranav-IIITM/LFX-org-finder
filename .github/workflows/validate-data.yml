name: "Validate Data"
on:
  pull_request:
    paths:
      - 'src/js/data.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check data.js for syntax errors
        run: node src/js/data.js
